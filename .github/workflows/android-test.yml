# Smoke test: install the published APK on an Android emulator, open it, and print any crash.
name: Test Android APK
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Download APK
        run: curl -sSL -o spark.apk https://github.com/ahmadmoh-911/spark-members/releases/download/android/spark.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r spark.apk
            adb logcat -c
            adb shell am start -W -n io.github.ahmadmoh911.spark/.LauncherActivity || true
            sleep 25
            adb logcat -d > logcat.txt || true
            echo "===== CRASHES ====="; grep -E -A 40 "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -150 || true
            echo "===== APP LINES ====="; grep -iE "ahmadmoh911|TwaLauncher|androidbrowserhelper|DigitalAssetLinks|OriginVerifier" logcat.txt | head -60 || true
            echo "===== TOP ACTIVITY ====="; adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -5 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
